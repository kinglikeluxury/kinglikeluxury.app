name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kinglike-mobile/mobile-app/android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: kinglike-mobile/mobile-app
        run: npm install

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build APK (debug)
        run: ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kinglike-luxury-debug
          path: kinglike-mobile/mobile-app/android/app/build/outputs/apk/debug/app-debug.apk
