name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kinglike-mobile/mobile-app/android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: kinglike-mobile/mobile-app
        run: npm install

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Generate Keystore
        run: |
          rm -f ./app/keystores/release.keystore
          mkdir -p ./app/keystores
          keytool -genkeypair -v -keystore ./app/keystores/release.keystore -alias kinglikeluxury -keyalg RSA -keysize 2048 -validity 10000 -storepass Kinglike123 -keypass Kinglike123 -dname "CN=Kinglike Luxury, OU=Mobile Development, O=Kinglike Luxury Real Estate, L=Tbilisi, S=Georgia, C=GE" -noprompt

      - name: Build APK (debug)
        run: ./gradlew assembleDebug

      - name: Build APK (release)
        run: ./gradlew assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kinglike-luxury-debug
          path: kinglike-mobile/mobile-app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: kinglike-luxury-release
          path: kinglike-mobile/mobile-app/android/app/build/outputs/apk/release/app-release.apk
